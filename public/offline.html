<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexión — Levado</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #FAF7F2;
            color: #3D2B1F;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            text-align: center;
        }
        img { width: 96px; height: 96px; border-radius: 20px; }
        h1 { font-size: 1.25rem; margin: 1.25rem 0 0.5rem; }
        p { font-size: 0.9rem; color: #6B5B45; margin: 0 1.5rem; }
        button {
            margin-top: 1.5rem;
            padding: 0.6rem 1.5rem;
            background: #3D2B1F;
            color: #fff;
            border: 0;
            border-radius: 0.4rem;
            font-size: 0.9rem;
            cursor: pointer;
        }
        button:hover { background: #C8622A; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="Levado">
        <h1>Sin conexión</h1>
        <p>No pudimos conectar con Levado. Revisá tu conexión a internet e intentá de nuevo.</p>
        <button onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
